name: Destravar publicação do Pages
on:
  push:
    paths: ['.github/workflows/destravar-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  actions: write
  contents: read
jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar publicação travada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/deployments/654a6662bdaf42d42f2327047b07cd4e310735f3/cancel || true
          sleep 20
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
